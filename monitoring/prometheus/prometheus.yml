global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # =====================================================
  # Prometheus itself
  # =====================================================
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "localhost:9090"

  # =====================================================
  # CloudWatch Exporter
  # =====================================================
  - job_name: "cloudwatch-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "cloudwatch-exporter:9106"
          - "cloudwatch-exporter.testcluster.local:9106"

  # =====================================================
  # Flask Backend Application
  # =====================================================
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:5000"
          - "backend.testcluster.local:5000"
