global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # AWS CloudWatch Exporter
  - job_name: "cloudwatch-exporter"
    static_configs:
      - targets:
          - "cloudwatch-exporter:9106"