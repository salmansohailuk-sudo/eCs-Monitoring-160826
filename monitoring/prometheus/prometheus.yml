global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:

  # =====================================================
  # PROMETHEUS ITSELF
  # =====================================================

  - job_name: "prometheus"

    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "localhost:9090"


  # =====================================================
  # CLOUDWATCH EXPORTER
  # EC2 / ALB / AWS CLOUDWATCH METRICS
  # =====================================================

  - job_name: "cloudwatch-exporter"

    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "cloudwatch-exporter:9106"


  # =====================================================
  # FLASK BACKEND
  # =====================================================

  - job_name: "backend"

    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "backend:5000"
          - "backend.testcluster.local:5000"


  # =====================================================
  # NGINX FRONTEND EXPORTER
  # =====================================================

  - job_name: "nginx-exporter"

    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "nginx-exporter:9113"
