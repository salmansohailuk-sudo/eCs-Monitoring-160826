<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .popup {
            width: 420px;
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            animation: popup 0.4s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cancel-icon {
            width: 90px;
            height: 90px;
            background: #dc3545;
            border-radius: 50%;
            margin: 0 auto 25px;
            color: white;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #dc3545;
            margin-bottom: 15px;
            font-size: 30px;
        }

        p {
            color: #555;
            font-size: 17px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .popup {
                width: 90%;
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="popup">
        <div class="cancel-icon">✕</div>

        <h1>Payment Cancelled</h1>

        <p>
            Your payment was cancelled and no charges have been made.<br>
            You can return to the store and try again whenever you're ready.
        </p>

        <a href="/" class="btn">
            ← Try Again
        </a>
    </div>

    <!-- Tracking Script -->
    <script>
        // Track cancellation
        fetch("/api/track-cancel", { method: "POST" });

        // Geo tracking
        (async () => {
            try {
                const geo = await fetch("https://ipapi.co/json").then(r => r.json());

                await fetch("/api/track-geo", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ip: geo.ip,
                        city: geo.city,
                        region: geo.region,
                        country: geo.country_name,
                        latitude: geo.latitude,
                        longitude: geo.longitude
                    })
                });
            } catch (err) {
                console.log("Geo tracking failed", err);
            }
        })();
    </script>
</body>
</html>
