<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Salman & Lokesh Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
.card{
    width:420px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
    text-align:center;
}
img{
    width:100%;
    border-radius:10px;
}
button{
    width:100%;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Wireless Headphones</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRH7OOE-tstslSRDMvBjL5ZGKsWOiWh0GPzpLPGLEKy_g&s=10">
    <h3>£49.99</h3>
    <button class="btn btn-primary" id="buyBtn">Buy Now</button>
</div>

<script src="https://js.stripe.com/v3/"></script>

<script>
const stripe = Stripe("pk_test_51TubqqKrKF732rFWUqyjg2kvCCVUXQV0z3M8BVP7BrBXT0nkc1E2BDKvwwVdJIqyJfxFDsRIeIBM2pR6JhevaMwG00194s0UXw");

// ------------------------------
// GEO LOCATION TRACKING
// ------------------------------
async function trackGeo() {
    try {
        const geo = await fetch("https://ipapi.co/json").then(r => r.json());

        await fetch("/api/track-geo", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                ip: geo.ip,
                city: geo.city,
                region: geo.region,
                country: geo.country_name,
                latitude: geo.latitude,
                longitude: geo.longitude
            })
        });
    } catch (err) {
        console.log("Geo tracking failed", err);
    }
}

// Track page visit
fetch("/api/track-visit", { method: "POST" });

// Track geo location
trackGeo();

// ------------------------------
// BUY BUTTON
// ------------------------------
document.getElementById("buyBtn").onclick = async () => {

    // Track user clicked Buy Now
    fetch("/api/track-start-checkout", { method: "POST" });

    const response = await fetch("/api/create-checkout-session", {
        method: "POST"
    });

    const session = await response.json();

    stripe.redirectToCheckout({
        sessionId: session.sessionId
    });
};
</script>
</body>
</html>
