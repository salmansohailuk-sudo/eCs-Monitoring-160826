<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>eComm Store Testing</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, .2);
            text-align: center;
            background: white;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            width: 100%;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>Wireless Headphones</h2>

        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRH7OOE-tstslSRDMvBjL5ZGKsWOiWh0GPzpLPGLEKy_g&s=10"
            alt="Wireless Headphones"
        >

        <h3 class="mt-3">£49.99</h3>

        <button
            class="btn btn-primary"
            id="buyBtn"
        >
            Buy Now
        </button>

    </div>


    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>


    <script>

        // =====================================================
        // STRIPE
        // =====================================================

        const stripe = Stripe(
            "pk_test_51TubqqKrKF732rFWUqyjg2kvCCVUXQV0z3M8BVP7BrBXT0nkc1E2BDKvwwVdJIqyJfxFDsRIeIBM2pR6JhevaMwG00194s0UXw"
        );


        // =====================================================
        // GEO LOCATION TRACKING
        // =====================================================

        async function trackGeo() {

            try {

                const response = await fetch(
                    "https://ipapi.co/json/"
                );

                const geo = await response.json();


                await fetch("/api/track-geo", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        ip: geo.ip,

                        city: geo.city,

                        region: geo.region,

                        country: geo.country_name,

                        latitude: geo.latitude,

                        longitude: geo.longitude

                    })

                });


            } catch (err) {

                console.log(
                    "Geo tracking failed:",
                    err
                );

            }

        }


        // =====================================================
        // TRACK PAGE VISIT
        // =====================================================

        fetch("/api/track-visit", {

            method: "POST"

        })
        .catch(err => {

            console.log(
                "Visit tracking failed:",
                err
            );

        });


        // =====================================================
        // TRACK GEO LOCATION
        // =====================================================

        trackGeo();


        // =====================================================
        // BUY BUTTON
        // =====================================================

        document
            .getElementById("buyBtn")
            .addEventListener("click", async () => {

                try {

                    // ---------------------------------------------
                    // TRACK START CHECKOUT
                    // ---------------------------------------------

                    fetch("/api/track-start-checkout", {

                        method: "POST"

                    })
                    .catch(err => {

                        console.log(
                            "Checkout tracking failed:",
                            err
                        );

                    });


                    // ---------------------------------------------
                    // CREATE STRIPE CHECKOUT SESSION
                    // ---------------------------------------------

                    const response = await fetch(
                        "/api/create-checkout-session",
                        {
                            method: "POST"
                        }
                    );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to create checkout session"
                        );

                    }


                    const session =
                        await response.json();


                    // ---------------------------------------------
                    // REDIRECT TO STRIPE
                    // ---------------------------------------------

                    const result =
                        await stripe.redirectToCheckout({

                            sessionId: session.sessionId

                        });


                    if (result.error) {

                        console.error(
                            result.error.message
                        );

                    }


                } catch (err) {

                    console.error(
                        "Checkout error:",
                        err
                    );

                    alert(
                        "Unable to start checkout. Please try again."
                    );

                }

            });

    </script>

</body>

</html>
