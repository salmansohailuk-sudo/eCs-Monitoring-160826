services:

  # =====================================================
  # E-COMMERCE FRONTEND
  # =====================================================

  frontend:
    container_name: ecomm-frontend

    image: ecomm-frontend:latest

    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - ecommerce-network


  # =====================================================
  # E-COMMERCE BACKEND
  # =====================================================

  backend:
    container_name: ecomm-backend

    image: ecomm-backend:latest

    build:
      context: ./backend

    env_file:
      - .env

    ports:
      - "5000:5000"

    networks:
      - ecommerce-network


  # =====================================================
  # NGINX PROMETHEUS EXPORTER
  # =====================================================

  nginx-exporter:
    container_name: monitoring-nginx-exporter

    image: monitoring-nginx-exporter:latest

    build:
      context: ./monitoring/nginx-exporter

    ports:
      - "9113:9113"

    depends_on:
      - frontend

    command:
      - "-nginx.scrape-uri=http://frontend/nginx_status"

    networks:
      - ecommerce-network


  # =====================================================
  # AWS CLOUDWATCH EXPORTER
  # =====================================================

  cloudwatch-exporter:
    container_name: monitoring-cloudwatch-exporter

    image: monitoring-cloudwatch-exporter:latest

    build:
      context: ./monitoring/cloudwatch-exporter

    ports:
      - "9106:9106"

    networks:
      - ecommerce-network


  # =====================================================
  # PROMETHEUS
  # =====================================================

  prometheus:
    container_name: monitoring-prometheus

    image: monitoring-prometheus:latest

    build:
      context: ./monitoring/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - backend
      - nginx-exporter
      - cloudwatch-exporter

    networks:
      - ecommerce-network


  # =====================================================
  # GRAFANA
  # =====================================================

  grafana:
    container_name: monitoring-grafana

    image: monitoring-grafana:latest

    build:
      context: ./monitoring/grafana

    ports:
      - "3000:3000"

    environment:

      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}

      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_SERVER_ROOT_URL: "http://${EC2_PUBLIC_IP}:3000/"

      GF_SERVER_SERVE_FROM_SUB_PATH: "false"

      PROMETHEUS_URL: "http://prometheus:9090"

    depends_on:
      - prometheus

    networks:
      - ecommerce-network


# =====================================================
# NETWORK
# =====================================================

networks:

  ecommerce-network:

    driver: bridge
